<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos para el funcionamiento de la pagina -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- Bootstrap (CSS, Animaciones ) --> 
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="./css/main.css">
     
    <!-- SEO -->
    <title>Speed Motors | Contacto & Citas</title>
    <link rel="icon" type="image/jpeg" href="../assets/images/LogoSpeedMotors.jpg">
    <meta name="description" content="Ponte en contacto con Speed Motors. Agenda tu cita para revisión, afinamiento o consulta de repuestos.">
    <meta name="keywords" content="contacto, agendar cita, formulario taller, telefono Speed Motors, ubicacion">
    <meta name="author" content="Axel">
    <link rel="stylesheet" href="../styles/main.css">

    <!--OPEN GRAPH-->
    <meta property="og:title" content="Speed Motors | Taller Mecánico & Performance">
    <meta property="og:description" content="Especialistas en mantenimiento, repuestos y modificación de rendimiento para tu vehículo. Atencion eficaz en Speed Motors!.">
    <meta property="og:image" content="https://raw.githubusercontent.com/Axel-wav/SpeedMotors-detalles-/refs/heads/main/assets/images/LogoSpeedMotors.jpg">
    <meta property="og:url" content="https://github.com/Axel-wav/SpeedMotors-detalles-.git">
    <meta property="og:type" content="website">
</head>
<body>

    <!-- navegacion -->
    <header class="header">
        <div class="header__container">
            <a href="../index.html" class="header__logo">SPEEDMOTORS</a>
            
            <nav class="nav">
                <ul class="nav__list">
                    <li class="nav__item"><a href="../index.html" class="nav__link">Inicio</a></li>
                    <li class="nav__item"><a href="./menu.html" class="nav__link">Servicios</a></li>
                    <li class="nav__item"><a href="./nosotros.html" class="nav__link">Nosotros</a></li>
                    <li class="nav__item"><a href="./galeria.html" class="nav__link">Galería</a></li>
                    <li class="nav__item"><a href="./contacto.html" class="nav__link nav__link--active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="contact">
        <section class="contact__hero">
            <h1>Agenda tu Consulta</h1>
            <p>Escríbenos para coordinar una revisión o resolver tus dudas sobre servicios.</p>
        </section>

        <section class="contact__content">
            <form class="form" action="./despedida.html" method="POST" data-netfily="true" name="contacto"> </form>
                <div class="form__group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form__input" placeholder="Ej. Axel" required>
                </div>

                <div class="form__group">
                    <label for="servicio">Servicio requerido:</label>
                    <select id="servicio" name="servicio" class="form__input" required>
                        <option value="">Selecciona una opción...</option>
                        <option value="afinamiento">Afinamiento & Balancines</option>
                        <option value="transmision">Relación de Transmisión</option>
                        <option value="diagnostico">Diagnóstico General</option>
                    </select>
                </div>

                <div class="form__group">
                    <label for="mensaje">Detalles de tu consulta:</label>
                    <textarea id="mensaje" name="mensaje" class="form__input" rows="4" placeholder="Cuéntanos el modelo o qué necesita tu vehículo..."></textarea>
                </div>

                <button type="submit" class="btn btn--primary">Enviar Consulta</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p> 2026 Speed Motors - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
